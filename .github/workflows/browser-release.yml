name: Release Browser Extension
run-name: Browser extension · ${{ github.ref_name }}

on:
  push:
    tags: ["browser-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check version and package extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check independent extension version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          version = json.loads(Path("extensions/browser/manifest.json").read_text())["version"]
          subprocess.run([sys.executable, "scripts/set_version.py", version, "--target", "browser", "--check"], check=True)
          if os.environ["REF_TYPE"] == "tag" and os.environ["REF_NAME"] != "browser-v" + version:
              raise SystemExit("Extension tag must equal browser-v plus the manifest version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json
      - name: Install locked extension dependencies
        working-directory: extensions/browser
        run: npm ci --no-audit --no-fund
      - name: Build production extension
        working-directory: extensions/browser
        run: npm run build
      - name: Check output and create ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          source = Path("extensions/browser/dist/production")
          version = os.environ["VERSION"]
          manifest = json.loads((source / "manifest.json").read_text())
          if manifest["version"] != version:
              raise SystemExit("Built manifest version differs from the checked source version")
          if json.loads((source / "workspace-origin.json").read_text())["origin"] != "http://localhost:8000":
              raise SystemExit("Release must use the production workspace origin")
          required = [manifest["background"]["service_worker"],
                      f'_locales/{manifest["default_locale"]}/messages.json',
                      "_locales/zh_CN/messages.json", *manifest["icons"].values(),
                      *manifest["action"]["default_icon"].values()]
          for script in manifest["content_scripts"]:
              required.extend(script["js"])
          for relative in required:
              if not (source / relative).is_file():
                  raise SystemExit(f"Missing extension resource: {relative}")

          destination = Path("dist/browser-release")
          destination.mkdir(parents=True, exist_ok=True)
          archive = destination / f"Rename_Studio-Browser-v{version}.zip"
          with zipfile.ZipFile(archive, "x", compression=zipfile.ZIP_DEFLATED) as output:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      output.write(path, path.relative_to(source).as_posix())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (destination / "SHA256SUMS.txt").write_text(f"{digest}  {archive.name}\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: browser-package-v${{ steps.version.outputs.version }}
          path: dist/browser-release/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  draft:
    name: Create extension release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/browser-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: browser-package-v${{ needs.build.outputs.version }}
          path: release/
      - name: Verify checksum and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          tag="browser-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; drafts and published assets will not be overwritten."
            exit 1
          fi
          cat > notes.md <<EOF
          Rename Studio Browser v$VERSION

          Browser extension only; download the Rename Studio application separately.

          - [Install and update instructions](https://github.com/$GH_REPO/blob/$tag/extensions/browser/README.md#安装发布包)
          - [Release and verification guide](https://github.com/$GH_REPO/blob/$tag/docs/RELEASING.md#浏览器扩展独立发布)

          Before publishing, add the changes and the application version verified with this extension.
          EOF
          gh release create "$tag" "Rename_Studio-Browser-v$VERSION.zip" SHA256SUMS.txt \
            --draft --verify-tag --latest=false --title "Rename Studio Browser v$VERSION" --notes-file notes.md
