name: Frontend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Classify complete PR diff
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs

      - name: Report unrelated changes
        if: steps.changes.outputs.scope == 'skip'
        run: echo "No frontend or Rule/Provider metadata changes; required check reported."

      - name: Install locked dependencies
        if: steps.changes.outputs.scope != 'skip'
        run: npm ci --no-audit --no-fund

      - name: Check translation resources and metadata
        if: steps.changes.outputs.scope != 'skip'
        run: npm run i18n:check

      - name: Run business and infrastructure tests
        id: tests
        if: steps.changes.outputs.scope == 'full'
        run: npm run test:ci

      - name: Type-check and production build
        if: steps.changes.outputs.scope == 'full'
        run: npm run build

      - name: Upload Vitest results
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-test-results
          path: frontend/test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 7
