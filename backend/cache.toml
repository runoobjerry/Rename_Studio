# 后端启动时读取。修改后重启后端。
# 两层缓存均按 LRU 淘汰。max_entries 设置可保留的条目上限。

[directory_listings]
ttl = 600                    # 非空目录列表有效期，秒
empty_ttl = 30               # 空目录列表有效期，秒
max_entries = 64             # 目录列表数量上限
max_bytes = 33_554_432        # 全部列表的序列化字节上限，32 MiB
max_entry_bytes = 8_388_608   # 单个列表的序列化字节上限，8 MiB

[directory_metadata]
ttl = 120                     # 文件夹元数据有效期，秒
max_entries = 2048           # 文件夹元数据条目上限
