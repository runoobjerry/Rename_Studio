[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rename-studio-backend"
version = "1.0.0a3"
description = "Local-first rule-driven batch rename API"
requires-python = ">=3.12"
dependencies = [
  "crossfiledialog==1.3.1",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  # Starlette TestClient prefers httpx2 while application code keeps using httpx.
  "httpx2>=2.0,<3.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.4,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

